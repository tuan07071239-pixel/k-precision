<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Flat Design Background: Warm Linen Beige -->
  <rect width="400" height="300" rx="8" fill="#EFECE1" stroke="#D5CFBE" stroke-width="1"/>
  
  <path d="M40 0v300 M80 0v300 M120 0v300 M160 0v300 M200 0v300 M240 0v300 M280 0v300 M320 0v300 M360 0v300" stroke="#E2DEC7" stroke-width="1"/>
  <path d="M0 30h400 M0 60h400 M0 90h400 M0 120h400 M0 150h400 M0 180h400 M0 210h400 M0 240h400 M0 270h400" stroke="#E2DEC7" stroke-width="1"/>

  <!-- Solid Granite Surface Plate (Flat Deep Forest Slate) -->
  <polygon points="60,220 340,220 310,260 30,260" fill="#1E3A2F" stroke="#142921" stroke-width="2"/>
  <polygon points="30,260 310,260 310,272 30,272" fill="#142921"/>

  <!-- CMM Bridge Columns (Flat Solid Beige/Warm Stone) -->
  <rect x="80" y="80" width="28" height="140" rx="2" fill="#FFFFFF" stroke="#B8AF9C" stroke-width="1.5"/>
  <rect x="292" y="80" width="28" height="140" rx="2" fill="#FFFFFF" stroke="#B8AF9C" stroke-width="1.5"/>

  <!-- Horizontal Crossbeam -->
  <rect x="70" y="70" width="260" height="32" rx="2" fill="#EFECE1" stroke="#B8AF9C" stroke-width="1.5"/>

  <!-- Z-Axis Ram Carriage (Solid Forest Green) -->
  <rect x="180" y="85" width="40" height="35" rx="2" fill="#1E3A2F" stroke="#142921" stroke-width="1.5"/>
  <rect x="194" y="120" width="12" height="60" fill="#FFFFFF" stroke="#B8AF9C" stroke-width="1.2"/>

  <!-- Ruby Probe Stylus Tip -->
  <line x1="200" y1="180" x2="200" y2="198" stroke="#1E3A2F" stroke-width="2"/>
  <circle cx="200" cy="201" r="4.5" fill="#C28B38" stroke="#A3722A" stroke-width="1"/>

  <!-- Test Workpiece on Plate -->
  <rect x="175" y="202" width="50" height="22" rx="2" fill="#FFFFFF" stroke="#B8AF9C" stroke-width="1.2"/>
  <ellipse cx="200" cy="203" rx="22" ry="5" stroke="#2D5844" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Laser / Optical Measurement Sensor Indicator -->
  <line x1="180" y1="120" x2="175" y2="202" stroke="#2D5844" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="220" y1="120" x2="225" y2="202" stroke="#2D5844" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Digital Readout Box (Solid Flat Forest Green) -->
  <rect x="235" y="130" width="135" height="52" rx="4" fill="#1E3A2F" stroke="#142921" stroke-width="1.5"/>
  <text x="245" y="148" font-family="'Courier New', monospace" font-size="8.5" font-weight="700" fill="#E2B167">CMM VERIFICATION</text>
  <text x="245" y="162" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#F6F4ED">Δ = +0.0008 mm</text>
  <text x="245" y="174" font-family="-apple-system, sans-serif" font-size="8" fill="#C5D6CC">ISO 9001:2015 PASSED</text>

  <!-- Badges -->
  <rect x="20" y="20" width="155" height="36" rx="4" fill="#1E3A2F"/>
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F6F4ED">QUALITY METROLOGY</text>
  <text x="30" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#C5D6CC">Sub-Micron Calibration</text>
</svg>