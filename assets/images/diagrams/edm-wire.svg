<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Flat Design Background: Warm Linen Beige -->
  <rect width="400" height="300" rx="8" fill="#EFECE1" stroke="#D5CFBE" stroke-width="1"/>
  
  <path d="M40 0v300 M80 0v300 M120 0v300 M160 0v300 M200 0v300 M240 0v300 M280 0v300 M320 0v300 M360 0v300" stroke="#E2DEC7" stroke-width="1"/>
  <path d="M0 30h400 M0 60h400 M0 90h400 M0 120h400 M0 150h400 M0 180h400 M0 210h400 M0 240h400 M0 270h400" stroke="#E2DEC7" stroke-width="1"/>

  <!-- Left: EDM Wire Spool (Flat Design) -->
  <g transform="translate(60, 80)">
    <!-- Spool Back Flange -->
    <ellipse cx="60" cy="70" rx="45" ry="60" fill="#2D5844" stroke="#1E3A2F" stroke-width="2"/>
    <!-- Solid Brass Wire Core -->
    <rect x="60" y="25" width="40" height="90" fill="#C28B38" stroke="#A3722A" stroke-width="1.5"/>
    <line x1="70" y1="25" x2="70" y2="115" stroke="#E5A84B" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="80" y1="25" x2="80" y2="115" stroke="#E5A84B" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="90" y1="25" x2="90" y2="115" stroke="#E5A84B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- Spool Front Flange -->
    <ellipse cx="100" cy="70" rx="45" ry="60" fill="#1E3A2F" stroke="#142921" stroke-width="2"/>
    <ellipse cx="100" cy="70" rx="18" ry="24" fill="#EFECE1" stroke="#B8AF9C" stroke-width="2"/>
    <!-- Spool Label -->
    <text x="75" y="65" font-family="'Courier New', monospace" font-size="7.5" font-weight="700" fill="#F6F4ED">Ø0.25mm</text>
    <text x="75" y="75" font-family="'Courier New', monospace" font-size="6.5" font-weight="600" fill="#C5D6CC">CuZn35</text>
    <text x="75" y="85" font-family="'Courier New', monospace" font-size="6.5" font-weight="600" fill="#E5A84B">980 N/mm²</text>
  </g>

  <!-- Wire Traveling Path (Solid Brass Line) -->
  <path d="M190 105 L260 80 L260 220 L300 240" stroke="#C28B38" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Upper Diamond Wire Guide (Flat Forest Green) -->
  <polygon points="248,70 272,70 268,90 252,90" fill="#1E3A2F" stroke="#142921" stroke-width="1.5"/>
  <rect x="254" y="62" width="12" height="8" fill="#B8AF9C"/>

  <!-- Lower Diamond Wire Guide -->
  <polygon points="252,210 268,210 272,230 248,230" fill="#1E3A2F" stroke="#142921" stroke-width="1.5"/>
  <rect x="254" y="230" width="12" height="8" fill="#B8AF9C"/>

  <!-- Workpiece Block (Flat Warm Slate) -->
  <rect x="262" y="115" width="80" height="70" rx="2" fill="#FFFFFF" stroke="#B8AF9C" stroke-width="1.5"/>
  <line x1="260" y1="150" x2="300" y2="150" stroke="#C28B38" stroke-width="3" stroke-linecap="round"/>

  <!-- Flat Spark Discharge Indicator (Solid Brass & Forest Green Accents) -->
  <polygon points="260,144 265,150 260,156 255,150" fill="#C28B38"/>
  <circle cx="260" cy="150" r="2" fill="#FFFFFF"/>

  <!-- Badges -->
  <rect x="20" y="24" width="145" height="36" rx="4" fill="#1E3A2F"/>
  <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F6F4ED">EDM BRASS &amp; COATED</text>
  <text x="30" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#C5D6CC">Auto-Threading Reliability</text>

  <rect x="235" y="248" width="145" height="36" rx="4" fill="#FFFFFF" stroke="#D5CFBE" stroke-width="1"/>
  <text x="245" y="264" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#1E3A2F">DISCHARGE STABILITY</text>
  <text x="245" y="276" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#58655E">Filters, Resins &amp; Wear Parts</text>
</svg>